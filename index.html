<script type="importmap">
{"imports":{

<script type="module">
import * as THREE from 'three';

// ── CONFIG ──
const MAX_SPEED = 230;
const MAX_REVERSE = 50;
const ACCEL = 120;
const BRAKE = 130;
const DRAG = 0.28;
const TURN_RATE = 2.8;
const CAM_DIST = 8;
const CAM_HEIGHT = 4.0;
const ROAD_W = 9;
const CHUNK_SIZE = 100;
const CHUNK_SEG = 40;
const VIEW_R = 4;
const WATER_LEVEL = -2;
const ENGINE_BRAKE = 0.06;
const GRIP_ROAD = 0.96;
const GRIP_OFFROAD = 0.65;
const GRIP_HB = 0.25;

// ── DOM ──
const spdEl = document.getElementById('speed');
const gearEl = document.getElementById('gear');
const rpmFill = document.getElementById('rpm-fill');
const hintEl = document.getElementById('hint');
const loadingEl = document.getElementById('loading');

// ── THREE SETUP ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a6a9a);
scene.fog = new THREE.FogExp2(0x3a6a9a, 0.0012);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 800);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setClearColor(0x3a6a9a);
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

// ── LIGHTING ──
const hemi = new THREE.HemisphereLight(0x88ccff, 0x445533, 0.5);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffbb77, 2.2);
sun.position.set(60, 90, -50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 300;
sun.shadow.camera.left = -120;
sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;
sun.shadow.camera.bottom = -120;
sun.shadow.bias = -0.002;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x4488ff, 0.4);
fill.position.set(-40, 30, 70);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xff8844, 0.3);
rim.position.set(-30, 40, -80);
scene.add(rim);

// ── NOISE ──
function hash(px, py) {
    const n = Math.sin(px * 12.9898 + py * 78.233) * 43758.5453;
    return n - Math.floor(n);
}

function smoothNoise(x, z) {
    const ix = Math.floor(x), iz = Math.floor(z);
    const fx = x - ix, fz = z - iz;
    const sx = fx * fx * (3 - 2 * fx);
    const sz = fz * fz * (3 - 2 * fz);
    const a = hash(ix, iz);
    const b = hash(ix + 1, iz);
    const c = hash(ix, iz + 1);
    const d = hash(ix + 1, iz + 1);
    return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}

function fbm(x, z, oct) {
    let v = 0, a = 1, f = 1, m = 0;
    for (let i = 0; i < oct; i++) {
        v += a * (smoothNoise(x * f, z * f) - 0.5) * 2;
        m += a; a *= 0.5; f *= 2;
    }
    return v / m;
}

// ── TERRAIN ──
function getHeight(x, z) {
    const h = fbm(x * 0.0018, z * 0.0018, 6) * 45
        + Math.exp(-(x*x+z*z) / 30000) * 10;
    const ridge = fbm(x * 0.0025, z * 0.0025, 4) * 0.8 + 0.2;
    const mountain = Math.max(0, ridge - 0.3) * 35;
    const smoothPeak = Math.max(0, 1 - Math.abs(fbm(x*0.004, z*0.004, 2)) * 1.5);
    const peaks = smoothPeak * smoothPeak * 25;
    return Math.max(WATER_LEVEL, h + mountain + peaks);
}

function getNormal(x, z) {
    const e = 0.5;
    const hx = getHeight(x + e, z);
    const hz = getHeight(x, z + e);
    const n = new THREE.Vector3(hx - getHeight(x - e, z), 2 * e, hz - getHeight(x, z - e)).normalize();
    return n;
}

function terrainColor(x, z, y, slope) {
    const n = (fbm(x * 0.01, z * 0.01, 3) - 0.5) * 0.1;
    const w = fbm(x*0.004, z*0.004, 2) * 0.5 + 0.5;
    let r, g, b;
    if (y < WATER_LEVEL + 0.5) {
        const t = (y - WATER_LEVEL) / 0.5;
        r = 0.65 + t * 0.1 + n; g = 0.55 + t * 0.15 + n; b = 0.20 + t * 0.05;
    } else if (y < WATER_LEVEL + 2) {
        const t = (y - WATER_LEVEL - 0.5) / 1.5;
        r = 0.75 - t * 0.29 + n; g = 0.70 - t * 0.08 + n; b = 0.25 - t * 0.11;
    } else if (y < 6) {
        const t = (y - WATER_LEVEL - 2) / 6;
        r = 0.46 + t * 0.05 + n; g = 0.62 - t * 0.05 + n; b = 0.14 + t * 0.02;
    } else if (y < 14) {
        const t = (y - 6) / 8;
        r = 0.51 + t * 0.10 + n; g = 0.57 - t * 0.08 + n; b = 0.16 + t * 0.03;
    } else if (y < 35) {
        const t = Math.min(1, (y - 14) / 21);
        r = 0.61 + t * 0.15 + n; g = 0.49 - t * 0.15 + n; b = 0.19 - t * 0.05;
    } else {
        const t = Math.min(1, (y - 35) / 30);
        r = 0.76 - t * 0.15 + n; g = 0.34 - t * 0.10 + n; b = 0.14 - t * 0.05;
    }
    const shade = 1 - slope * 0.25;
    return [
        Math.max(0.015, r * shade),
        Math.max(0.015, g * shade),
        Math.max(0.015, b * shade)
    ];
}

// ── TERRAIN CHUNKS ──
const terrainMat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.85, metalness:0.0});
const activeChunks = new Map();

function buildChunk(cx, cz) {
    const ox = cx * CHUNK_SIZE, oz = cz * CHUNK_SIZE;
    const geo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, CHUNK_SEG, CHUNK_SEG);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position.array;
    const col = new Float32Array(pos.length);

    for (let i = 0; i < pos.length; i += 3) {
        const wx = ox + pos[i], wz = oz + pos[i+2];
        const h = getHeight(wx, wz);
        pos[i+1] = h;
        const sl = (
            Math.abs(getHeight(wx+1, wz)-h) + Math.abs(getHeight(wx-1, wz)-h) +
            Math.abs(getHeight(wx, wz+1)-h) + Math.abs(getHeight(wx, wz-1)-h)
        ) / 4;
        const [r, g, b] = terrainColor(wx, wz, h, sl);
        col[i] = r; col[i+1] = g; col[i+2] = b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(geo, terrainMat);
    mesh.position.set(ox, 0, oz);
    mesh.receiveShadow = true;
    scene.add(mesh);
    return mesh;
}

function updateChunks(px, pz) {
    const cx = Math.round(px / CHUNK_SIZE);
    const cz = Math.round(pz / CHUNK_SIZE);
    const needed = new Set();
    for (let dx = -VIEW_R; dx <= VIEW_R; dx++)
        for (let dz = -VIEW_R; dz <= VIEW_R; dz++)
            needed.add(`${cx+dx},${cz+dz}`);

    for (const [k, v] of activeChunks) {
        if (!needed.has(k)) { scene.remove(v); v.geometry.dispose(); activeChunks.delete(k); }
    }
    for (const k of needed) {
        if (!activeChunks.has(k)) {
            const [x, z] = k.split(',').map(Number);
            activeChunks.set(k, buildChunk(x, z));
        }
    }
}

// ── WATER ──
const waterMat = new THREE.MeshBasicMaterial({color:0x1a6a8a, transparent:true, opacity:0.55, depthWrite:false});
const waterChunks = new Map();

function buildWaterChunk(cx, cz) {
    const geo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE);
    geo.rotateX(-Math.PI / 2);
    const mesh = new THREE.Mesh(geo, waterMat);
    mesh.position.set(cx * CHUNK_SIZE, WATER_LEVEL, cz * CHUNK_SIZE);
    scene.add(mesh);
    return mesh;
}

function updateWater(px, pz) {
    const cx = Math.round(px / CHUNK_SIZE), cz = Math.round(pz / CHUNK_SIZE);
    const needed = new Set();
    for (let dx = -VIEW_R; dx <= VIEW_R; dx++)
        for (let dz = -VIEW_R; dz <= VIEW_R; dz++)
            needed.add(`${cx+dx},${cz+dz}`);
    for (const [k, v] of waterChunks) {
        if (!needed.has(k)) { scene.remove(v); v.geometry.dispose(); waterChunks.delete(k); }
    }
    for (const k of needed) {
        if (!waterChunks.has(k)) {
            const [x, z] = k.split(',').map(Number);
            waterChunks.set(k, buildWaterChunk(x, z));
        }
    }
}

// ── ROAD ──
const NUM_RP = 2500;
const roadWP = [];
function buildRoadWaypoints() {
    let x = 0, z = 0, a = 0;
    for (let i = 0; i < NUM_RP; i++) {
        const n = (fbm(i * 0.008, 0.7, 3) - 0.5) * 3;
        a += n * 0.4;
        const dist = Math.sqrt(x*x+z*z);
        if (dist > 600) a -= (dist - 600) * 0.002;
        const step = 5;
        x += Math.cos(a) * step;
        z += Math.sin(a) * step;
        roadWP.push({x, z});
    }
}
buildRoadWaypoints();

const roadGeo = new THREE.BufferGeometry();
(function buildFullRoad() {
    const hw = ROAD_W/2;
    const verts = [], idx = [];
    for (let i = 0; i < NUM_RP; i++) {
        const n = NUM_RP;
        const pi = roadWP[(i-1+n)%n], pj = roadWP[i], pk = roadWP[(i+1)%n];
        const dx = pk.x - pi.x, dz = pk.z - pi.z;
        const ml = Math.sqrt(dx*dx+dz*dz) || 1;
        const nx = -dz/ml, nz = dx/ml;
        const h1 = getHeight(pj.x - nx*hw, pj.z - nz*hw) + 0.3;
        const h2 = getHeight(pj.x + nx*hw, pj.z + nz*hw) + 0.3;
        const b = i * 4;
        verts[b*3] = pj.x - nx*hw; verts[b*3+1] = h1; verts[b*3+2] = pj.z - nz*hw;
        verts[(b+1)*3] = pj.x + nx*hw; verts[(b+1)*3+1] = h2; verts[(b+1)*3+2] = pj.z + nz*hw;
        const qi = roadWP[(i+1)%n];
        const dx2 = roadWP[(i+2)%n].x - pj.x, dz2 = roadWP[(i+2)%n].z - pj.z;
        const ml2 = Math.sqrt(dx2*dx2+dz2*dz2) || 1;
        const nx2 = -dz2/ml2, nz2 = dx2/ml2;
        const h3 = getHeight(qi.x - nx2*hw, qi.z - nz2*hw) + 0.3;
        const h4 = getHeight(qi.x + nx2*hw, qi.z + nz2*hw) + 0.3;
        verts[(b+2)*3] = qi.x - nx2*hw; verts[(b+2)*3+1] = h3; verts[(b+2)*3+2] = qi.z - nz2*hw;
        verts[(b+3)*3] = qi.x + nx2*hw; verts[(b+3)*3+1] = h4; verts[(b+3)*3+2] = qi.z + nz2*hw;
        idx.push(b, b+2, b+1, b+1, b+2, b+3);
    }
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    roadGeo.setIndex(idx);
    roadGeo.computeVertexNormals();
})();

const roadMat = new THREE.MeshStandardMaterial({color:0x2a2a2a, roughness:0.95, metalness:0.0});
const roadMesh = new THREE.Mesh(roadGeo, roadMat);
roadMesh.receiveShadow = true;
scene.add(roadMesh);

// Center dashes
const dashMat = new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide});
const dashGroup = new THREE.Group();
(function buildDashes() {
    for (let i = 0; i < NUM_RP; i++) {
        if (i % 4 !== 0) continue;
        const p = roadWP[i], q = roadWP[(i+1)%NUM_RP];
        const dx = q.x-p.x, dz = q.z-p.z;
        const ml = Math.sqrt(dx*dx+dz*dz) || 1;
        const cx = p.x+dx*0.5, cz = p.z+dz*0.5;
        const h = getHeight(cx, cz)+0.45;
        const m = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 1.5), dashMat);
        m.position.set(cx, h, cz);
        m.quaternion.setFromUnitVectors(
            new THREE.Vector3(0,0,1),
            new THREE.Vector3(0,1,0)
        );
        const up = new THREE.Vector3(0,1,0);
        const dir = new THREE.Vector3(dx, 0, dz).normalize();
        const right = new THREE.Vector3().crossVectors(dir, up).normalize();
        const m4 = new THREE.Matrix4().makeBasis(right, dir, up);
        m.quaternion.setFromRotationMatrix(m4);
        dashGroup.add(m);
    }
})();
scene.add(dashGroup);

// ── TREES ──
const trunkM = new THREE.MeshStandardMaterial({color:0x4a3520, roughness:0.9});
const canopyM = [
    new THREE.MeshStandardMaterial({color:0x2a6b2a, roughness:0.8}),
    new THREE.MeshStandardMaterial({color:0x3a7a3a, roughness:0.8}),
    new THREE.MeshStandardMaterial({color:0x4a8a3a, roughness:0.8}),
    new THREE.MeshStandardMaterial({color:0x2d5a2d, roughness:0.8}),
    new THREE.MeshStandardMaterial({color:0x5a9a4a, roughness:0.8}),
    new THREE.MeshStandardMaterial({color:0x6aaa5a, roughness:0.8}),
];
const deadTrunkM = new THREE.MeshStandardMaterial({color:0x5a4530, roughness:0.95});
const fallCanopyM = new THREE.MeshStandardMaterial({color:0xcc6633, roughness:0.9});
const pineCanopyM = new THREE.MeshStandardMaterial({color:0x1a4a1a, roughness:0.85});

// Shared geometries
const trunkG = new THREE.CylinderGeometry(0.25, 0.4, 2.5, 4);
const tallTrunkG = new THREE.CylinderGeometry(0.2, 0.35, 4.5, 4);
const thinTrunkG = new THREE.CylinderGeometry(0.12, 0.18, 3, 4);
const canopyG = new THREE.ConeGeometry(2.2, 4.5, 5);
const tallCanopyG = new THREE.ConeGeometry(1.2, 5.5, 5);
const roundCanopyG = new THREE.SphereGeometry(1.8, 5, 4);
const bushG = new THREE.SphereGeometry(0.9, 4, 3);

const treeTypes = [
    // Pine (cone)
    { trunk: trunkG, trunkScale: [1,1,1], trunkMat: trunkM, canopy: canopyG, canopyMat: canopyM, canopyPos: [0, 2.5, 0], canopyScale: [1,1,1], weight: 3 },
    // Tall pine
    { trunk: tallTrunkG, trunkScale: [0.7,1.2,0.7], trunkMat: trunkM, canopy: tallCanopyG, canopyMat: pineCanopyM, canopyPos: [0, 4.5, 0], canopyScale: [1,1.2,1], weight: 2 },
    // Round canopy
    { trunk: trunkG, trunkScale: [0.9,0.9,0.9], trunkMat: trunkM, canopy: roundCanopyG, canopyMat: canopyM, canopyPos: [0, 2.2, 0], canopyScale: [1.2,0.9,1.2], weight: 3 },
    // Multi-tier (stack of 3 cones)
    { trunk: trunkG, trunkScale: [0.8,0.8,0.8], trunkMat: trunkM, canopy: canopyG, canopyMat: canopyM, canopyPos: [0, 1.8, 0], canopyScale: [0.8,0.6,0.8], weight: 2, extraTiers: 2 },
    // Dead tree
    { trunk: tallTrunkG, trunkScale: [0.6,1.5,0.6], trunkMat: deadTrunkM, canopy: null, canopyMat: null, canopyPos: null, canopyScale: null, weight: 1 },
    // Bush
    { trunk: thinTrunkG, trunkScale: [0.8,0.5,0.8], trunkMat: trunkM, canopy: bushG, canopyMat: canopyM, canopyPos: [0, 1.2, 0], canopyScale: [1.5,0.7,1.5], weight: 2 },
];

const treeChunks = new Map();
const collisionTrees = [];

function buildTreeShape(type, s) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(type.trunk, type.trunkMat);
    trunk.scale.set(type.trunkScale[0]*s, type.trunkScale[1]*s, type.trunkScale[2]*s);
    trunk.castShadow = true;
    g.add(trunk);

    if (type.canopy) {
        const canopy = new THREE.Mesh(type.canopy, type.canopyMat[Math.floor(Math.random()*type.canopyMat.length)]);
        canopy.position.set(type.canopyPos[0], type.canopyPos[1]*s, type.canopyPos[2]);
        canopy.scale.set(type.canopyScale[0]*s, type.canopyScale[1]*s, type.canopyScale[2]*s);
        canopy.castShadow = true;
        g.add(canopy);

        if (type.extraTiers) {
            for (let t = 1; t <= type.extraTiers; t++) {
                const tier = new THREE.Mesh(type.canopy, type.canopyMat[Math.floor(Math.random()*type.canopyMat.length)]);
                const ty = type.canopyPos[1]*s + t * 1.3 * s;
                const ts = 1 - t * 0.15;
                tier.position.set(0, ty, 0);
                tier.scale.set(type.canopyScale[0]*s*ts, type.canopyScale[1]*s*ts, type.canopyScale[2]*s*ts);
                tier.castShadow = true;
                g.add(tier);
            }
        }
    }
    return g;
}

function buildTreesForChunk(cx, cz) {
    const g = new THREE.Group();
    const ox = cx * CHUNK_SIZE, oz = cz * CHUNK_SIZE;
    const count = 12 + Math.floor(fbm(cx * 3.7, cz * 3.7, 2) * 8 + 5);
    // Pre-compute total weight
    const totalW = treeTypes.reduce((s, t) => s + t.weight, 0);

    for (let i = 0; i < count; i++) {
        const hx = hash(cx * 1000 + i * 7, cz * 1000 + i * 13);
        const hz = hash(cx * 1000 + i * 11, cz * 1000 + i * 5);
        const tx = ox + (hx - 0.5) * CHUNK_SIZE * 0.85;
        const tz = oz + (hz - 0.5) * CHUNK_SIZE * 0.85;
        const hy = getHeight(tx, tz);
        if (hy < -3 || hy > 35) continue;
        let nearRoad = false;
        for (const rp of roadWP) {
            if ((tx-rp.x)**2+(tz-rp.z)**2 < 100) { nearRoad = true; break; }
        }
        if (nearRoad) continue;

        // Weighted random tree type
        let r = Math.random() * totalW, typeIdx = 0;
        for (let tw = 0; typeIdx < treeTypes.length; typeIdx++) {
            tw += treeTypes[typeIdx].weight;
            if (r <= tw) break;
        }
        const treeType = treeTypes[Math.min(typeIdx, treeTypes.length-1)];
        const s = 0.6 + fbm(tx*0.1, tz*0.1, 2) * 0.4;

        const tree = buildTreeShape(treeType, s);
        tree.position.set(tx, hy, tz);
        tree.rotation.y = Math.random() * 6.28;
        g.add(tree);

        // Store trunk collision data
        collisionTrees.push({x: tx, z: tz, r: 0.6 * s});
    }
    return g;
}

function updateTrees(px, pz) {
    const cx = Math.round(px / CHUNK_SIZE), cz = Math.round(pz / CHUNK_SIZE);
    const needed = new Set();
    for (let dx = -VIEW_R; dx <= VIEW_R; dx++)
        for (let dz = -VIEW_R; dz <= VIEW_R; dz++)
            needed.add(`${cx+dx},${cz+dz}`);
    for (const [k, v] of treeChunks) {
        if (!needed.has(k)) { scene.remove(v); treeChunks.delete(k); }
    }
    for (const k of needed) {
        if (!treeChunks.has(k)) {
            const [x, z] = k.split(',').map(Number);
            const g = buildTreesForChunk(x, z);
            scene.add(g);
            treeChunks.set(k, g);
        }
    }
}

// ── GRASS ──
const grassMat = new THREE.MeshStandardMaterial({roughness:0.9, metalness:0.0, vertexColors:true});
const grassChunks = new Map();

function buildGrassForChunk(cx, cz) {
    const ox = cx * CHUNK_SIZE, oz = cz * CHUNK_SIZE;
    const pts = [];
    const cols = [];
    for (let i = 0; i < 400; i++) {
        const hx = hash(cx*1000+i*3, cz*1000+i*7);
        const hz = hash(cx*1000+i*5, cz*1000+i*11);
        const gx = ox + (hx - 0.5) * CHUNK_SIZE * 0.9;
        const gz = oz + (hz - 0.5) * CHUNK_SIZE * 0.9;
        const hy = getHeight(gx, gz);
        if (hy < -2 || hy > 20) continue;
        let nr = false;
        for (const rp of roadWP) if ((gx-rp.x)**2+(gz-rp.z)**2<36) { nr=true; break; }
        if (nr) continue;
        const sl = (Math.abs(getHeight(gx+0.5,gz)-hy)+Math.abs(getHeight(gx,gz+0.5)-hy))/2;
        if (sl > 1.5) continue;
        pts.push({x:gx, y:hy, z:gz});
        const tc = terrainColor(gx, gz, hy, 0);
        cols.push(new THREE.Color(tc[0]*0.6+0.2, tc[1]*0.6+0.2, tc[2]*0.6+0.2));
    }
    if (!pts.length) return null;

    const bladeH = 0.4;
    const bg = new THREE.BufferGeometry();
    const bladeVerts = new Float32Array([
        -0.04,0,0,  0.04,0,0,  0,bladeH,0,
        -0.03,0.15,0,  0,bladeH,0,  0.03,0.15,0
    ]);
    bg.setAttribute('position', new THREE.BufferAttribute(bladeVerts, 3));
    bg.setIndex([0,1,2, 3,4,5]);
    bg.computeVertexNormals();

    const im = new THREE.InstancedMesh(bg, grassMat, pts.length);
    const d = new THREE.Object3D();
    for (let i = 0; i < pts.length; i++) {
        const s = 0.3 + Math.random() * 1.2;
        d.position.set(pts[i].x, pts[i].y, pts[i].z);
        d.scale.set(s, s * (0.5 + Math.random() * 0.8), s);
        d.rotation.set(0, Math.random()*6.28, (Math.random()-0.5)*0.15);
        d.updateMatrix();
        im.setMatrixAt(i, d.matrix);
        im.setColorAt(i, cols[i]);
    }
    im.instanceMatrix.needsUpdate = true;
    im.instanceColor.needsUpdate = true;
    im.frustumCulled = true;
    return im;
}

function updateGrass(px, pz) {
    const cx = Math.round(px / CHUNK_SIZE), cz = Math.round(pz / CHUNK_SIZE);
    const needed = new Set();
    for (let dx = -VIEW_R; dx <= VIEW_R; dx++)
        for (let dz = -VIEW_R; dz <= VIEW_R; dz++)
            needed.add(`${cx+dx},${cz+dz}`);
    for (const [k, v] of grassChunks) {
        if (!needed.has(k)) { if(v)scene.remove(v); grassChunks.delete(k); }
    }
    for (const k of needed) {
        if (!grassChunks.has(k)) {
            const [x, z] = k.split(',').map(Number);
            const g = buildGrassForChunk(x, z);
            if (g) scene.add(g);
            grassChunks.set(k, g);
        }
    }
}

// ── SKY ──
function createSky() {
    const tex = document.createElement('canvas');
    tex.width = 1; tex.height = 512;
    const ctx = tex.getContext('2d');
    const grad = ctx.createLinearGradient(0,0,0,512);
    grad.addColorStop(0, '#0b0b2a');
    grad.addColorStop(0.25, '#1a2a5a');
    grad.addColorStop(0.5, '#4a7db0');
    grad.addColorStop(0.65, '#8ab5d8');
    grad.addColorStop(0.75, '#d4a060');
    grad.addColorStop(0.85, '#e8843a');
    grad.addColorStop(1, '#c06020');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,1,512);
    const t = new THREE.CanvasTexture(tex);
    t.magFilter = THREE.LinearFilter;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: { skyTex: { value: t }, sunDir: { value: new THREE.Vector3(0.5, 0.7, -0.5).normalize() } },
        vertexShader: `varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1);}`,
        fragmentShader: `uniform sampler2D skyTex;uniform vec3 sunDir;varying vec2 vUv;void main(){vec2 uv=vUv;uv.y=1.-uv.y;vec4 c=texture2D(skyTex,uv);float s=max(0.,dot(sunDir,vec3(0,1,0)));float sun=pow(max(0.,dot(normalize(vec3(0,1,1)),sunDir)),64.)*.8;gl_FragColor=c+vec4(1,.8,.4,0)*sun*.6;float h=pow(max(0.,1.-abs(uv.y-.7)*5.),8.)*.3;gl_FragColor.rgb+=vec4(1,.7,.3,0).rgb*h;}`,
    });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(700, 32, 48), skyMat);
    scene.add(sky);

    const cloudMat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.35, side:THREE.DoubleSide, depthWrite:false});
    const cg = new THREE.Group();
    for (let i = 0; i < 80; i++) {
        const a = Math.random()*6.28, r = 300+Math.random()*200, h = 80+Math.random()*120;
        const c = new THREE.Mesh(new THREE.SphereGeometry(15+Math.random()*30, 5, 4), cloudMat);
        c.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
        c.scale.y = 0.15 + Math.random()*0.2;
        cg.add(c);
    }
    scene.add(cg);
}

function buildFestival() {
    const g = new THREE.Group();
    const fx = -15, fz = 25;
    const fy = getHeight(fx, fz);

    const darkMat = new THREE.MeshStandardMaterial({color:0x1a1a2e, roughness:0.1, metalness:0.5});

    g.add(stage);

    const pillarMat = new THREE.MeshStandardMaterial({color:0x2a2a3e, metalness:0.4, roughness:0.3});
    for (let side = -1; side <= 1; side += 2) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5, 0.4), pillarMat);
        p.position.set(fx+side*5.5, fy+3.5, fz-13);
        g.add(p);

    const arch = new THREE.Mesh(new THREE.BoxGeometry(12, 0.4, 0.4), darkMat);
    arch.position.set(fx, fy+6.2, fz-13);
    g.add(arch);

    const signMat = new THREE.MeshStandardMaterial({color:0xf7c948, emissive:0xf7c948, emissiveIntensity:0.6});
    const sign = new THREE.Mesh(new THREE.BoxGeometry(7, 0.7, 0.2), signMat);
    sign.position.set(fx, fy+5.8, fz-12.7);
    g.add(sign);

    const tentColors = [[0xff6b35,0xf7c948],[0x6b35ff,0xff6b35],[0x35b5ff,0x6bff35],[0xff35b5,0x35b5ff],[0xf7c948,0xff6b35]];
    const tOffsets = [[-18,-3],[18,-2],[-15,12],[14,10],[-4,18],[3,17],[-12,-14],[12,-12],[-8,22],[22,2],[-22,6],[6,-18]];
    for (let i = 0; i < tOffsets.length; i++) {
        const tx = fx + tOffsets[i][0], tz = fz + tOffsets[i][1];
        const ty = getHeight(tx, tz);
        const sz = 3.5 + fbm(tx*0.1, tz*0.1, 2) * 1.5;
        const c1 = tentColors[i%5][0], c2 = tentColors[i%5][1];
        const cone = new THREE.Mesh(new THREE.ConeGeometry(sz*0.6, sz*0.9, 4), new THREE.MeshStandardMaterial({color:c1, roughness:0.9, side:THREE.DoubleSide}));
        cone.position.set(tx, ty+sz*0.45, tz);
        cone.rotation.y = Math.PI/4 + i;
        g.add(cone);

        const stripe = new THREE.Mesh(new THREE.ConeGeometry(sz*0.55, sz*0.6, 4), new THREE.MeshStandardMaterial({color:c2, roughness:0.9, side:THREE.DoubleSide, transparent:true, opacity:0.4}));
        stripe.position.set(tx, ty+sz*0.3, tz);
        g.add(stripe);
    }

    const bulbMat = new THREE.MeshStandardMaterial({color:0xffdd44, emissive:0xffdd44, emissiveIntensity:2});
    for (let i = 0; i < 50; i++) {
        const a = Math.random()*6.28, r = 12+Math.random()*18;
        const lx = fx + Math.cos(a)*r, lz = fz + Math.sin(a)*r+5;
        const ly = getHeight(lx, lz) + 3.5 + Math.random()*2;
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), bulbMat);
        bulb.position.set(lx, ly, lz);
        g.add(bulb);
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.04, ly-getHeight(lx, lz), 3), new THREE.MeshBasicMaterial({color:0x333}));
        pole.position.set(lx, (ly+getHeight(lx, lz))/2, lz);
        g.add(pole);
    }

    for (let i = 0; i < 8; i++) {
        const a = i*0.8+0.3;
        const r1 = 15+i*1.5, r2 = 15+(i+1)*1.5;
        const x1 = fx+Math.cos(a)*r1, z1 = fz+Math.sin(a)*r1+7;
        const x2 = fx+Math.cos(a+0.3)*r2, z2 = fz+Math.sin(a+0.3)*r2+7;
        const h1 = getHeight(x1, z1)+5, h2 = getHeight(x2, z2)+5;
        const cc = tentColors[i%5][0];
        const strMat = new THREE.MeshBasicMaterial({color:cc, side:THREE.DoubleSide, transparent:true, opacity:0.7});
        for (let j = 0; j < 8; j++) {
            const t = j/8;
            const px = x1+(x2-x1)*t, pz = z1+(z2-z1)*t;
            const ph = h1+(h2-h1)*t + Math.sin(j*1.8)*0.3;
            const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.35), strMat);
            flag.position.set(px, ph, pz);
            flag.rotation.y = -Math.atan2(z2-z1, x2-x1);
            flag.rotation.x = Math.sin(j*2)*0.1;
            g.add(flag);
        }
    }

    const fireMat = new THREE.MeshBasicMaterial({color:0xff6600, transparent:true, opacity:0.5});
    const fireG = new THREE.SphereGeometry(0.4, 6, 6);
    for (let i = 0; i < 8; i++) {
        const f = new THREE.Mesh(fireG, fireMat);
        f.position.set(fx-2+Math.random()*4, fy+0.15+Math.random()*0.3, fz+19+Math.random()*3);
        f.scale.set(1, 0.3+Math.random()*0.6, 1);
        g.add(f);
    }
    const logMat = new THREE.MeshBasicMaterial({color:0x4a3020});
    for (let i = 0; i < 5; i++) {
        const l = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.8, 4), logMat);
        l.position.set(fx-0.3+Math.random()*0.6, fy+0.05, fz+20+Math.random()*0.6);
        l.rotation.z = (Math.random()-0.5)*0.5;
        l.rotation.x = (Math.random()-0.5)*0.5;
        g.add(l);
    }
    return g;
}

        const tread = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.22, 0.015), new THREE.MeshBasicMaterial({color:0x111}));
        const a = j * 0.524;
        tread.position.set(Math.cos(a)*0.355, 0, Math.sin(a)*0.355);
        tread.rotation.y = a;
        wg.add(tread);
    }

    wg.position.set(sx, 0.15, sz);
    car.add(wg);
    wheels.push(wg);
}

const startPos = {x: -15, z: 31};
const sy = getHeight(startPos.x, startPos.z);
car.position.set(startPos.x, sy+0.4, startPos.z);
scene.add(car);

// ── PHYSICS STATE ──
let speed = 0;
let heading = 0.5;
const carPos = new THREE.Vector3(startPos.x, sy+0.4, startPos.z);
let velDir = heading;
let driftAngle = 0;
let targetRoll = 0;
let curRoll = 0, curPitch = 0;
let gear = 0;
const gearSpeeds = [0, 45, 100, 155, 210, MAX_SPEED+1];
const gearNames = ['N','1','2','3','4','5'];
let rpm = 0;
let brakeLightIntensity = 0.1;
let collisionCooldown = 0;

// ── PARTICLES ──
const MAX_P = 500;
const pPos = new Float32Array(MAX_P * 3);
const pVel = new Float32Array(MAX_P * 3);
const pLife = new Float32Array(MAX_P);
const pSize = new Float32Array(MAX_P);
let pIdx = 0;

const particlesGeo = new THREE.BufferGeometry();
particlesGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
particlesGeo.setAttribute('size', new THREE.BufferAttribute(pSize, 1));
const particlesMat = new THREE.PointsMaterial({
    color: 0xccccbb, size: 0.6, transparent: true, opacity: 0.6,
    depthWrite: false, blending: THREE.NormalBlending
});
const particles = new THREE.Points(particlesGeo, particlesMat);
scene.add(particles);

function emitParticles(cx, cy, cz, count, spread, color) {
    for (let i = 0; i < count; i++) {
        const i3 = pIdx * 3;
        pPos[i3] = cx + (Math.random()-0.5)*spread;
        pPos[i3+1] = cy + Math.random()*0.3;
        pPos[i3+2] = cz + (Math.random()-0.5)*spread;
        pVel[i3] = (Math.random()-0.5)*(color ? 4 : 2);
        pVel[i3+1] = (color ? 0.5 : 0.3) + Math.random()*0.8;
        pVel[i3+2] = (Math.random()-0.5)*(color ? 4 : 2);
        pLife[pIdx] = (color ? 0.3 : 0.5) + Math.random()*0.8;
        pSize[pIdx] = (color ? 0.5 : 0.3) + Math.random()*0.5;
        pIdx = (pIdx + 1) % MAX_P;
    }
}

function updateParticles(dt) {
    for (let i = 0; i < MAX_P; i++) {
        if (pLife[i] > 0) {
            pLife[i] -= dt;
            const i3 = i * 3;
            pPos[i3] += pVel[i3] * dt;
            pPos[i3+1] += pVel[i3+1] * dt;
            pPos[i3+2] += pVel[i3+2] * dt;
            pVel[i3+1] -= 1.8 * dt;
            pSize[i] *= (1 - dt * 0.5);
        } else {
            pPos[i*3] = 0; pPos[i*3+1] = -100; pPos[i*3+2] = 0;
        }
    }
    particlesGeo.attributes.position.needsUpdate = true;
    particlesGeo.attributes.size.needsUpdate = true;
}

// ── CONTROLS ──
const keys = {f:false,b:false,l:false,r:false,hb:false};
document.addEventListener('keydown', e => {
    if (e.code === 'KeyW'||e.code==='ArrowUp') keys.f=true;
    if (e.code === 'KeyS'||e.code==='ArrowDown') keys.b=true;
    if (e.code === 'KeyA'||e.code==='ArrowLeft') keys.l=true;
    if (e.code === 'KeyD'||e.code==='ArrowRight') keys.r=true;
    if (e.code === 'Space') { keys.hb=true; e.preventDefault(); }
    e.preventDefault();
});
document.addEventListener('keyup', e => {
    if (e.code === 'KeyW'||e.code==='ArrowUp') keys.f=false;
    if (e.code === 'KeyS'||e.code==='ArrowDown') keys.b=false;
    if (e.code === 'KeyA'||e.code==='ArrowLeft') keys.l=false;
    if (e.code === 'KeyD'||e.code==='ArrowRight') keys.r=false;
    if (e.code === 'Space') keys.hb=false;
    e.preventDefault();
});

let touchSteer=0,touchAccel=0;
renderer.domElement.addEventListener('touchstart', hTouch, {passive:false});
renderer.domElement.addEventListener('touchmove', hTouch, {passive:false});
renderer.domElement.addEventListener('touchend', ()=>{touchSteer=0;touchAccel=0;}, {passive:false});
function hTouch(e) {
    e.preventDefault();
    if (!e.touches.length) return;
    const mx = innerWidth/2, my = innerHeight/2;
    let s=0,a=0;
    for (const t of e.touches) {
        s += Math.max(-1, Math.min(1, (t.clientX-mx)/mx));
        a += Math.max(-1, Math.min(1, (my-t.clientY)/my));
    }
    const n = e.touches.length;
    touchSteer = s/n; touchAccel = a/n;
}

setTimeout(() => hintEl.style.opacity='0', 6000);

// ── AUDIO ──
let aCtx, osc, gain, flt;
function initAudio() {
    if (aCtx) return;
    try {
        aCtx = new (window.AudioContext||window.webkitAudioContext)();
        osc = aCtx.createOscillator();
        gain = aCtx.createGain();
        flt = aCtx.createBiquadFilter();
        flt.type = 'lowpass';
        flt.frequency.value = 400;
        osc.type = 'sawtooth';
        osc.frequency.value = 55;
        gain.gain.value = 0.03;
        osc.connect(flt); flt.connect(gain); gain.connect(aCtx.destination);
        osc.start();

        const tireOsc = aCtx.createOscillator();
        const tireGain = aCtx.createGain();
        tireOsc.type = 'sawtooth';
        tireOsc.frequency.value = 200;
        tireGain.gain.value = 0;
        tireOsc.connect(tireGain);
        tireGain.connect(aCtx.destination);
        tireOsc.start();
        return {tireOsc, tireGain};
    } catch(e) { return null; }
}
let tireAudio = null;
let audioStarted = false;

// ── CAMERA STATE ──
const camPos = new THREE.Vector3();
camPos.copy(camera.position);

// ── UPDATE ──
function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI*2;
    while (a < -Math.PI) a += Math.PI*2;
    return a;
}

function update(dt) {
    if (dt > 0.05) dt = 0.05;

    // Input
    let steer=0, accel=0, hb=false;
    if (keys.l) steer=1; if (keys.r) steer=-1;
    if (keys.f) accel=1; if (keys.b) accel=-1;
    if (keys.hb) hb=true;
    if (Math.abs(touchSteer)>0.15) steer=touchSteer;
    if (Math.abs(touchAccel)>0.15) accel=touchAccel;

    // Terrain under car
    const terrainY = getHeight(carPos.x, carPos.z);

    // Collision check with trees
    if (collisionCooldown > 0) collisionCooldown -= dt;
    let hitTree = false;
    for (const tree of collisionTrees) {
        const dx = carPos.x - tree.x;
        const dz = carPos.z - tree.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if (dist < tree.r + 0.8) {
            hitTree = true;
            if (collisionCooldown <= 0 && Math.abs(speed) > 5) {
                // Push car away from tree
                const angle = Math.atan2(dx, dz);
                carPos.x += Math.sin(angle) * 0.5;
                carPos.z += Math.cos(angle) * 0.5;
                speed *= -0.3;
                collisionCooldown = 0.3;
                emitParticles(tree.x, terrainY, tree.z, 15, 0.8, 1);
            }
            break;
        }
    }

    // On-road check
    const onRoad = (()=>{
        for (const rp of roadWP)
            if ((carPos.x-rp.x)**2+(carPos.z-rp.z)**2 < 300) return true;
        return false;
    })();

    // ── ENGINE MODEL ──
    // Torque curve: peak at ~60% RPM
    const rpmNorm = Math.min(1, Math.abs(speed) / gearSpeeds[Math.max(1, gear)] * 1.2);
    const torqueFactor = Math.sin(rpmNorm * Math.PI * 0.65) * 1.1;
    const engineForce = torqueFactor * ACCEL;

    // ── DRAG ──
    const aeroDrag = Math.abs(speed) * DRAG * 0.015;
    const rollingDrag = DRAG * 0.005;

    // ── ACCELERATION ──
    if (accel > 0) {
        const driveForce = engineForce * (1 - Math.abs(speed) / MAX_SPEED * 0.6);
        speed += driveForce * dt;
    } else if (accel < 0) {
        if (speed > 0) {
            speed -= BRAKE * dt;
        } else {
            speed += ACCEL * 0.3 * dt;
        }
    } else {
        // Engine braking + drag
        const eBrake = speed > 0 ? ENGINE_BRAKE * (0.3 + rpmNorm * 0.7) : ENGINE_BRAKE * 0.3;
        speed -= Math.sign(speed) * Math.min(Math.abs(speed), eBrake * dt);
        speed *= (1 - (aeroDrag + rollingDrag) * dt);
        if (Math.abs(speed) < 0.1) speed = 0;
    }
    speed = Math.max(-MAX_REVERSE, Math.min(MAX_SPEED, speed));

    // ── GEAR ──
    const absSpd = Math.abs(speed);
    let targetGear = gear;
    if (gear === 0 && accel > 0 && absSpd > 0.3) targetGear = 1;
    else if (absSpd > gearSpeeds[gear] + 15 && gear < 5) targetGear = gear + 1;
    else if (absSpd < gearSpeeds[gear-1] - 5 && gear > 0) targetGear = gear - 1;
    if (accel <= 0 && absSpd < 1) targetGear = 0;
    if (targetGear !== gear) {
        gear = targetGear;
        gearEl.textContent = gearNames[gear];
        gearEl.classList.add('active');
        setTimeout(()=>gearEl.classList.remove('active'),150);
    }

    // ── RPM ──
    if (gear === 0) rpm = 0;
    else {
        const gearMin = gearSpeeds[gear-1]||0;
        const gearMax = gearSpeeds[gear];
        const t = Math.min(1, Math.max(0, (absSpd - gearMin) / (gearMax - gearMin)));
        rpm = t * 0.9 + (accel > 0 ? 0.08 : -0.03) + (hb ? 0.1 : 0);
        rpm = Math.max(0, Math.min(1, rpm));
        // Add some RPM variation from torque
        rpm += (1 - torqueFactor) * 0.05 * (accel > 0 ? 1 : 0);
        rpm = Math.max(0, Math.min(1, rpm));
    }
    rpmFill.style.width = (rpm * 100) + '%';

    // ── STEERING & DRIFT ──
    const spdFactor = 1 - (absSpd / MAX_SPEED) * 0.4;
    const turnAmt = steer * TURN_RATE * spdFactor * dt;
    heading += turnAmt;

    // Grip model
    let grip = hb ? GRIP_HB : (onRoad ? GRIP_ROAD : GRIP_OFFROAD);

    // Weight transfer: braking gives front grip, accelerating reduces it
    const weightTransfer = (accel < 0 && speed > 0 ? 1 : accel > 0 ? -0.5 : 0) * 0.15;
    grip += weightTransfer;
    grip = Math.max(0.15, Math.min(0.98, grip));

    // Drift: slip angle reduces grip, grip recovers smoothly
    const targetVelDir = heading + normalizeAngle(velDir - heading) * (1 - grip * 3 * dt);
    velDir += normalizeAngle(targetVelDir - velDir) * Math.min(1, 3 * dt);
    velDir = normalizeAngle(velDir);

    // Calculate drift angle for visual and audio
    driftAngle = normalizeAngle(velDir - heading);
    const driftFactor = Math.abs(driftAngle);

    // Steering visual roll with drift feel
    if (absSpd > 3) {
        targetRoll = -steer * (absSpd / MAX_SPEED) * 0.35 * (hb ? 2 : 1);
        targetRoll += Math.sign(driftAngle) * driftFactor * 0.2;
    } else {
        targetRoll *= 0.95;
    }

    // ── POSITION ──
    carPos.x += Math.sin(velDir) * speed * dt;
    carPos.z += Math.cos(velDir) * speed * dt;

    // Extra slide during drift
    const slideFactor = driftFactor * Math.abs(speed) * 0.03;
    carPos.x += Math.sin(heading + Math.PI/2) * slideFactor * dt;
    carPos.z += Math.cos(heading + Math.PI/2) * slideFactor * dt;

    // ── TERRAIN FOLLOW ──
    const eps = 1;
    const hF = getHeight(carPos.x+Math.sin(heading)*eps, carPos.z+Math.cos(heading)*eps);
    const hR = getHeight(carPos.x+Math.sin(heading+Math.PI/2)*eps, carPos.z+Math.cos(heading+Math.PI/2)*eps);
    const newTerrainY = getHeight(carPos.x, carPos.z);

    // Weight transfer visual: pitch under accel/brake
    const pitchWt = (accel < 0 && speed > 0 ? 1 : accel > 0 ? -0.6 : 0) * 0.08;
    curPitch += (Math.atan2(hF-newTerrainY, eps)*0.15 + pitchWt - curPitch) * Math.min(1, 8*dt);
    curRoll += (targetRoll + Math.atan2(hR-newTerrainY, eps)*0.12 - curRoll) * Math.min(1, 6*dt);
    carPos.y = newTerrainY + 0.45;

    // ── BRAKE LIGHTS ──
    const targetBrake = (accel < 0 && speed > 0) || hb ? 1.5 : 0.1;
    brakeLightIntensity += (targetBrake - brakeLightIntensity) * 0.1;

    // ── UPDATE CAR MESH ──
    car.position.copy(carPos);
    car.rotation.set(curPitch, heading, curRoll);

    // ── WHEELS ──
    for (const w of wheels) {
        w.children[0].rotation.x += speed * dt * 6;
        w.children[1].rotation.x += speed * dt * 6;
        if (Math.abs(w.position.z-1.4) < 0.01) {
            w.rotation.y = steer * 0.5 * spdFactor;
        }
    }

    // ── BRAKE LIGHT EMISSIVE ──
    car.children.forEach(c => {
        if (c.geometry && c.geometry.type==='CircleGeometry' && c.position.z < -2) {
            c.material.emissiveIntensity = brakeLightIntensity;
        }
    });
    brkL.material.emissiveIntensity = brakeLightIntensity;

    // ── PARTICLES ──
    const offRoad = !onRoad || hb || Math.abs(driftAngle) > 0.08;
    if (absSpd > 8 && offRoad) {
        const pCount = Math.floor(absSpd / 15 * (hb?3:1)) + 1;
        const spread = hb ? 0.6 : 0.4;
        const sx = Math.sin(heading+Math.PI/2) * 0.5;
        const sz = Math.cos(heading+Math.PI/2) * 0.5;
        emitParticles(carPos.x-sx, carPos.y, carPos.z-sz, pCount, spread, 0);
        emitParticles(carPos.x+sx, carPos.y, carPos.z+sz, pCount, spread, 0);
    }
    updateParticles(dt);

    // ── CAMERA ──
    const camDist = CAM_DIST + absSpd/MAX_SPEED*3;
    const camHeight = CAM_HEIGHT + absSpd/MAX_SPEED*1.5;
    const camTarget = new THREE.Vector3(
        carPos.x - Math.sin(heading)*camDist,
        carPos.y + camHeight,
        carPos.z - Math.cos(heading)*camDist
    );
    const ctH = getHeight(camTarget.x, camTarget.z);
    if (camTarget.y < ctH + 1.5) camTarget.y = ctH + 1.5;

    const camLerp = 2.5 + absSpd/MAX_SPEED*2;
    camPos.lerp(camTarget, Math.min(1, camLerp*dt));

    const shake = (hb ? 0.06 : absSpd/MAX_SPEED*0.02) + (hitTree ? 0.1 : 0);
    camPos.x += (Math.random()-0.5)*shake;
    camPos.y += (Math.random()-0.5)*shake;
    camPos.z += (Math.random()-0.5)*shake;

    camera.position.copy(camPos);

    const lookTarget = new THREE.Vector3(
        carPos.x + Math.sin(heading)*8,
        carPos.y + 1.5 + absSpd/MAX_SPEED*0.5,
        carPos.z + Math.cos(heading)*8
    );
    camera.lookAt(lookTarget);

    const targetFov = 65 + (absSpd/MAX_SPEED)*6;
    camera.fov += (targetFov-camera.fov) * 0.04 * 60 * dt;
    camera.updateProjectionMatrix();

    // ── AUDIO ──
    if (!audioStarted && absSpd>0.3) {
        const a = initAudio();
        if (a) tireAudio = a;
        audioStarted = true;
    }
    if (osc) {
        const base = 45 + rpm * 200;
        osc.frequency.value = Math.max(40, Math.min(350, base));
        flt.frequency.value = 150 + rpm * 600;
        gain.gain.value = 0.015 + rpm * 0.06;
    }
    if (tireAudio && (hb || driftFactor > 0.15)) {
        tireAudio.tireGain.gain.value = Math.min(0.05, driftFactor * 0.08);
        tireAudio.tireOsc.frequency.value = 150 + absSpd*2;
    } else if (tireAudio) {
        tireAudio.tireGain.gain.value *= 0.95;
    }

    // ── HUD ──
    const ds = Math.round(absSpd * 1.15);
    spdEl.textContent = ds;
    if (ds > 180) spdEl.style.color = '#ff4444';
    else if (ds > 130) spdEl.style.color = '#ff8844';
    else if (ds > 80) spdEl.style.color = '#f7c948';
    else spdEl.style.color = '#ffffff';

    // ── CHUNK UPDATES ──
    updateChunks(carPos.x, carPos.z);
    updateTrees(carPos.x, carPos.z);
    updateGrass(carPos.x, carPos.z);
    updateWater(carPos.x, carPos.z);
}

// ── SETTINGS ──
const settingsBtn = document.getElementById('settings-btn');
const settingsPanel = document.getElementById('settings-panel');
const rdSlider = document.getElementById('rd-slider');
const rdVal = document.getElementById('rd-val');

settingsBtn.addEventListener('click', () => settingsPanel.classList.toggle('open'));

rdSlider.addEventListener('input', () => {
    const v = parseInt(rdSlider.value);
    rdVal.textContent = v;
    if (v !== VIEW_R) {
        VIEW_R = v;
        for (const [k, mesh] of activeChunks) { scene.remove(mesh); mesh.geometry.dispose(); }
        activeChunks.clear();
        for (const [k, g] of treeChunks) { scene.remove(g); }
        treeChunks.clear();
        for (const [k, g] of grassChunks) { if (g) scene.remove(g); }
        grassChunks.clear();
        for (const [k, m] of waterChunks) { scene.remove(m); m.geometry.dispose(); }
        waterChunks.clear();
        collisionTrees.length = 0;
        updateChunks(carPos.x, carPos.z);
        updateTrees(carPos.x, carPos.z);
        updateGrass(carPos.x, carPos.z);
        updateWater(carPos.x, carPos.z);
    }
});

const carColors = [
    {name:'Punainen', hex:'#cc2222'},
    {name:'Sininen', hex:'#2266cc'},
    {name:'Vihreä', hex:'#22aa44'},
    {name:'Musta', hex:'#222222'},
    {name:'Valkoinen', hex:'#eeeeee'},
    {name:'Keltainen', hex:'#ddbb22'},
    {name:'Oranssi', hex:'#ee6633'},
    {name:'Violetti', hex:'#8833cc'},
];
const ccContainer = document.getElementById('car-colors');
let selColorBtn = null;
for (const c of carColors) {
    const btn = document.createElement('button');
    btn.style.background = c.hex;
    btn.title = c.name;
    if (c.hex === '#cc2222') { btn.classList.add('sel'); selColorBtn = btn; }
    btn.addEventListener('click', () => {
        if (selColorBtn) selColorBtn.classList.remove('sel');
        btn.classList.add('sel');
        selColorBtn = btn;
        bMat.color.set(c.hex);
    });
    ccContainer.appendChild(btn);
}

// ── GAME LOOP ──
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    update(clock.getDelta());
    renderer.render(scene, camera);
}

// ── START ──
setTimeout(() => loadingEl.classList.add('hidden'), 1500);
animate();

// ── RESIZE ──
window.addEventListener('resize', () => {
    const w = innerWidth, h = innerHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});
</script>
